apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-monitoring-13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-monitoring-13
  template:
    metadata:
      labels:
        app: flask-monitoring-13
    spec:
      containers:
        - name: flask-monitoring-13
          image: hbayraktar/flask-monitoring:latest
          ports:
            - containerPort: 5000
          resources:
            limits:
              memory: "200Mi"
              cpu: "200m"
            requests:
              memory: "100Mi"
              cpu: "100m"
